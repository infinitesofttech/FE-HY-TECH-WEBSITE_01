<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <!-- DigiLocker Emblem -->
  <g transform="translate(10, 8)">
    <!-- Blue Document Base -->
    <rect x="6" y="8" width="34" height="38" rx="5" fill="#0066CC"/>
    <!-- Folded Green Corner -->
    <path d="M30 8 L40 18 L30 18 Z" fill="#10B981"/>
    <!-- White Lock Shape inside Document -->
    <rect x="18" y="24" width="16" height="14" rx="2" fill="#FFFFFF"/>
    <path d="M21 24 V19 A5 5 0 0 1 31 19 V24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="26" cy="30" r="1.8" fill="#0066CC"/>
    <path d="M26 31 V34" stroke="#0066CC" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20">
    <tspan fill="#1E3A8A">Digi</tspan><tspan fill="#0284C7">Locker</tspan>
  </text>
  <text x="65" y="46" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="7.5" fill="#059669" letter-spacing="0.5">
    PAPERLESS GOVERNANCE
  </text>
</svg>
