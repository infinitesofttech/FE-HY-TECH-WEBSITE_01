<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Aadhaar Sun Rays & Fingerprint Emblem -->
  <g transform="translate(10, 4)">
    <!-- Red Sun Flame Elements -->
    <path d="M26 4 C28 10, 24 16, 26 26 C24 20, 20 14, 26 4 Z" fill="#E31E24"/>
    <path d="M26 4 C21 9, 19 16, 17 24 C19 18, 17 12, 26 4 Z" fill="#E31E24"/>
    <path d="M26 4 C31 9, 33 16, 35 24 C33 18, 35 12, 26 4 Z" fill="#E31E24"/>
    <path d="M12 12 C18 15, 20 21, 20 28 C16 23, 14 19, 12 12 Z" fill="#E31E24"/>
    <path d="M40 12 C34 15, 32 21, 32 28 C36 23, 38 19, 40 12 Z" fill="#E31E24"/>
    <!-- Fingerprint Arch Pattern in Aadhaar Red -->
    <path d="M14 38 A12 12 0 0 1 38 38" fill="none" stroke="#E31E24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 41 A8 8 0 0 1 34 41" fill="none" stroke="#E31E24" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 44 A4 4 0 0 1 30 44" fill="none" stroke="#E31E24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="31" r="2.5" fill="#E31E24"/>
    <!-- Red Curve at bottom -->
    <path d="M6 46 Q26 53 46 46" fill="none" stroke="#E31E24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Text: आधार / AADHAAR -->
  <text x="68" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#E31E24" letter-spacing="1">आधार</text>
  <text x="68" y="39" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#E31E24" letter-spacing="2">AADHAAR</text>
  <text x="68" y="49" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="8" fill="#555555">UIDAI • Govt. of India</text>
</svg>
